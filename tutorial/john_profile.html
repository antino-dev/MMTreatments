<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Doe — Kindred</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/profile.css">
</head>
<body>
<div class="desktop-shell">
  <div class="profile-grid">
    <div class="col-left">
      <div class="name-header">
        <h1>John Doe</h1>
        <div class="name-sub">26 · San Francisco, CA</div>
      </div>
      <div class="photo-card card">
        <img src="john_poster.jpg" alt="Photo of John Doe">
      </div>
      <div class="info-strip">
        <div class="info-row">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <span>26 · Man</span>
        </div>
        <div class="info-row">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <span>San Francisco, CA</span>
        </div>
        <div class="info-row">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 22s-8-5-8-11a8 8 0 0 1 16 0c0 6-8 11-8 11z"/></svg>
          <span>5'10''</span>
        </div>
      </div>
      <div class="tag-card">
        <div class="prompt-label">Interests</div>
        <div class="tag-row">
          <span class="tag">🎵 Live Music</span>
          <span class="tag">💻 Building Apps</span>
          <span class="tag">🌃 Late Nights</span>
          <span class="tag">🏄 Surfing</span>
          <span class="tag">🍜 Ramen runs</span>
          <span class="tag">🎮 Gaming</span>
          <span class="tag">🚀 Startups</span>
          <span class="tag">🛣️ Road trips</span>
        </div>
      </div>
    </div>
    <!-- Prompt cards are rendered by ../shared/profile.js according to ?AI= -->
    <div class="col-right" id="promptList"></div>
  </div>
</div>

<div class="action-bar">
  <div class="action-bar-inner">
    <button type="button" class="action-skip" id="skipBtn" aria-label="Skip">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <button type="button" class="action-like" id="likeBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Like John Doe
    </button>
    <button type="button" class="action-star" id="starBtn" aria-label="Super like">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    </button>
  </div>
</div>

<script>
  // Tutorial profile: same layout and conditions as the study profiles, with its own (neutral) card content.
  window.PROFILE = {
    id: "john", first: "John", full: "John Doe", pron: { she: "he", her: "his", him: "him" },
    prompts: [
      {
        key: "family", target: true,
        title: "Family Plans",
        short: "I'm open to having kids someday.",
        long: "I can see myself with kids down the road, but I'm not in a rush. I'd rather find the right person first and figure out the timing together.",
        question: "So {Name} told you about {her} family plans. I'm curious, does {she} want kids?",
        keywords: ["kid", "child", "famil"],
        reply1: "{Name} can see {him}self with kids down the road, but {she}'s not in a rush. {She}'d rather find the right person first and figure out the timing together.",
        reply2: "{Name} is open to having kids someday. {She} can see {him}self with kids down the road, but {she}'s not in a rush. {She}'d rather find the right person first and figure out the timing together."
      },
      {
        key: "past", target: true,
        title: "Past Relationships",
        short: "I've had a few good relationships, each lasting about a year.",
        long: "My longest relationships lasted about a year. We drifted apart when work got busy, and I've learned to make more room for the people I care about.",
        question: "{Name} mentioned {her} past relationships. What's {her} story there?",
        keywords: ["relationship", "\\bex\\b", "\\bpast\\b"],
        reply1: "{Name}'s longest relationships lasted about a year. They drifted apart when work got busy, and {she}'s learned to make more room for the people {she} cares about.",
        reply2: "{Name} has had a few good relationships, each lasting about a year. They drifted apart when work got busy, and {she}'s learned to make more room for the people {she} cares about."
      },
      {
        key: "career", target: true,
        title: "Career",
        short: "I'm an app developer at a startup, and I love what I do.",
        long: "I build mobile apps at a small startup in SoMa. Most weeks are calm, launches get hectic, and I like that what I make ends up in people's hands quickly.",
        question: "What's {Name}'s work life like? I'm curious how busy {she} gets.",
        keywords: ["work", "\\bjob", "career"],
        reply1: "{Name} builds mobile apps at a small startup in SoMa. Most weeks are calm and launches get hectic, and {she} likes that what {she} makes ends up in people's hands quickly.",
        reply2: "{Name} is an app developer at a startup and loves what {she} does. {She} builds mobile apps at a small company in SoMa. Most weeks are calm and launches get hectic, and {she} likes that what {she} makes ends up in people's hands quickly."
      },
      {
        // Control card: identical in every condition, never routed through the matchmaker.
        key: "hobbies", target: false,
        title: "Hobbies",
        short: "You'll find me surfing on weekend mornings and at live shows at night.",
        long: "Most weekend mornings I'm surfing at Ocean Beach if the waves cooperate. At night you'll find me at a small venue in the Mission catching whoever's playing.",
        keywords: ["hobb", "surf", "music"]
      },
      {
        key: "passions", target: true,
        title: "Passions & Lifestyle",
        short: "Building things in my spare time is what I love most.",
        long: "I always have a side project going; lately it's a little app that helps friends split grocery runs. I love making something useful out of nothing.",
        question: "I'd love to know what {Name} is passionate about. How does {she} like to spend {her} time?",
        keywords: ["passion", "interest", "project"],
        reply1: "{Name} always has a side project going; lately it's a little app that helps friends split grocery runs. {She} loves making something useful out of nothing.",
        reply2: "{Name} loves building things in {her} spare time. Lately {she}'s building a little app that helps friends split grocery runs. {She} loves making something useful out of nothing."
      }
    ]
  };
</script>
<script src="../shared/profile.js"></script>
</body>
</html>
